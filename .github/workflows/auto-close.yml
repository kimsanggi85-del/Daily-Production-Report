name: 생산일보 자동 마감

# 업무 종료 10분 뒤 자동 마감: 월·화·목·금 19:10 / 수 17:10 (토·일·빨간날 17:10, 연장이면 최종 가동 10분 뒤)
# 다음날 07:00 전날 재마감 (늦게 들어온 작업자 마감 반영) → 이어서 생산관리 브리핑(ntfy)
# GitHub 예약 실행은 10분 간격이면 대부분 건너뛰므로 정해진 시각 + 예비 실행만 둔다 (이미 마감한 날은 스크립트가 건너뜀)
# 시각(UTC = KST-9): 17:10 = 08:10 / 19:10 = 10:10 / 07:00 = 22:00(전날)
on:
  schedule:
    - cron: "10 8 * * *"          # 17:10 — 수·토·일·빨간날 (19시 종료일은 '아직'으로 건너뜀)
    - cron: "40 8 * * *"          # 17:40 예비
    - cron: "10 10 * * 1,2,4,5"   # 월·화·목·금 19:10
    - cron: "40 10 * * 1,2,4,5"   # 19:40 예비
    - cron: "10 11-14 * * *"      # 20:10~23:10 연장·지연 예비
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / evening / morning / brief(생산관리 브리핑만)"
        default: "auto"
      date:
        description: "YYYY-MM-DD (비우면 자동)"
        default: ""
      dry:
        description: "true = 저장하지 않고 확인만"
        default: "false"
      force:
        description: "true = 시각·중복 판단 무시"
        default: "false"

concurrency:
  group: auto-close
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock jsdom@24
      - name: 자동 마감
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          # 07:00 예약 실행은 GitHub 지연이 있어도 morning 으로 고정
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then MODE=morning; fi
          ARGS="$MODE ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          if [ "$MODE" != "brief" ]; then node scripts/auto_close.mjs $ARGS; fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      - name: 생산관리 브리핑
        # 07:00 재마감 뒤 (또는 수동 실행 brief) — 실패해도 마감 결과에는 영향 없음
        if: ${{ always() && (github.event.schedule == '0 22 * * *' || github.event.inputs.mode == 'brief' || github.event.inputs.mode == 'morning') }}
        run: |
          ARGS="${{ github.event.inputs.mode == 'brief' && github.event.inputs.date || '' }}"
          [ "${{ github.event.inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          node scripts/pm_brief.mjs $ARGS
